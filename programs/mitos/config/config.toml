theme = "nord-custom"

[editor]
line-number = "relative"
mouse = true
auto-format = true
default-yank-register = "+"
cursor-shape.insert = "bar"
icons = true

[editor.inline-diagnostics]
other-lines = "info"

[editor.indent-guides]
render = true

[editor.lsp]
display-inlay-hints = true

[editor.scroll]
smooth = true

[keys.insert]
"C-l" = "move_char_right"
"C-h" = "move_char_left"
"C-k" = "move_visual_line_up"
"C-j" = "move_visual_line_down"

[keys.normal]
A-j = "page_cursor_half_down"
A-k = "page_cursor_half_up"

[keys.select]
A-j = "page_cursor_half_down"
A-k = "page_cursor_half_up"
